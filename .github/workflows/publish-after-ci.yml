name: Publish verified prerelease
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Confirm current main, version and release absence
        id: gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha').Trim()
          if ($head -ne $env:EXPECTED_COMMIT) {
            Write-Host 'A newer main commit exists; the newer CI run will decide the release.'
            "publish=false" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
            exit 0
          }
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          $pluginVersion = (Get-Content orca-plugin/orca-plugin.json -Raw | ConvertFrom-Json).version
          if ($version -ne $pluginVersion) { throw "Version/manifest mismatch: $version vs $pluginVersion" }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; not overwriting."
            "publish=false" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
            exit 0
          }
          "publish=true" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          "tag=$tag" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
      - name: Recheck tests and compile mod on Windows
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check orca-plugin/accounts.mjs
          node --check orca-plugin/bridge-core.mjs
          node --check orca-plugin/main.mjs
          node --test tests/accounts.test.mjs tests/bridge.test.mjs tests/dashboard.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Node tests failed' }
          python tests/check_csharp.py
          python tests/check_voice_patterns.py
          python tests/check_dashboard.py
          python tests/check_public_repo.py
          if ($LASTEXITCODE -ne 0) { throw 'Python checks failed' }
          dotnet build tests/windows-compile/CapriBridgeCompile.csproj -c Release -v minimal
          if ($LASTEXITCODE -ne 0) { throw 'Windows C# compile failed' }
      - name: Package installation ZIP
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $paths = @('capri-mod','orca-plugin','tests','README.md','REPORTE_PRUEBAS.md','LICENSE','VERSION','diagnostico_windows.ps1')
          Compress-Archive -Path $paths -DestinationPath "dist/Capri-Orca-Bridge-${{ steps.gate.outputs.tag }}.zip"
      - name: Publish experimental release
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create $env:TAG "dist/Capri-Orca-Bridge-$env:TAG.zip" --repo $env:GITHUB_REPOSITORY --target $env:EXPECTED_COMMIT --title "Capri-Orca Bridge $env:TAG (experimental)" --prerelease --notes "Pruebas Node/Python y compilacion C# contra stub en Windows aprobadas. La integracion real en Capri + Orca y el microfono de Windows requieren verificacion manual; usar bajo responsabilidad propia."
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release failed' }
