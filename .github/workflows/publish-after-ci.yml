name: Publish verified prerelease
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Confirm current main, version and release absence
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const head = context.payload.workflow_run.head_sha;
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (branch.commit.sha !== head) {
              core.info('A newer main commit exists; its CI run will decide the release.');
              core.setOutput('publish', 'false');
              return;
            }
            const version = fs.readFileSync('VERSION', 'utf8').trim();
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw Error(`Invalid version: ${version}`);
            const pluginVersion = JSON.parse(fs.readFileSync('orca-plugin/orca-plugin.json', 'utf8')).version;
            if (version !== pluginVersion) throw Error(`Version/manifest mismatch: ${version} vs ${pluginVersion}`);
            const tag = `v${version}`;
            try {
              await github.rest.repos.getReleaseByTag({owner, repo, tag});
              core.info(`Release ${tag} already exists; not overwriting.`);
              core.setOutput('publish', 'false');
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            core.setOutput('publish', 'true');
            core.setOutput('tag', tag);
      - name: Recheck tests and compile mod on Windows
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check orca-plugin/accounts.mjs
          node --check orca-plugin/bridge-core.mjs
          node --check orca-plugin/main.mjs
          node --test tests/accounts.test.mjs tests/bridge.test.mjs tests/dashboard.test.mjs tests/version.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Node tests failed' }
          python tests/check_csharp.py
          python tests/check_voice_patterns.py
          python tests/check_dashboard.py
          python tests/check_public_repo.py
          if ($LASTEXITCODE -ne 0) { throw 'Python checks failed' }
          dotnet build tests/windows-compile/CapriBridgeCompile.csproj -c Release -v minimal
          if ($LASTEXITCODE -ne 0) { throw 'Windows C# compile failed' }
      - name: Package installation ZIP
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        run: |
          ./tools/package.ps1 -Tag "${{ steps.gate.outputs.tag }}" -OutputDir dist
      - name: Publish experimental release
        if: steps.gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.gate.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Capri-Orca Bridge ${{ steps.gate.outputs.tag }} (experimental)
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Prerelease experimental: pruebas Node/Python y compilación C# contra un stub en Windows superadas.
            La integración real con Capri + Orca y el micrófono de Windows requiere pruebas manuales.
